# Example tunnel configuration. The real `config.yml` is created on the
# Proxmox VM and contains the tunnel UUID; it must not be committed.
#
# Two public hostnames are mapped to two internal services:
#   - api.kp.example.com      → FastAPI on http://api:8000
#   - tickets.kp.example.com  → MinIO on  http://minio:9000

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_UUID.json

ingress:
  - hostname: api.kp.example.com
    service: http://api:8000
  - hostname: tickets.kp.example.com
    service: http://minio:9000
    originRequest:
      noTLSVerify: true
  - service: http_status:404
