# Optional self-hosted GlitchTip overlay. Compose with the prod stack:
#
#   docker compose --env-file .env \
#       -f infra/docker-compose.yml \
#       -f infra/compose.prod.yml \
#       -f infra/compose.glitchtip.yml \
#       up -d
#
# Required additional env in .env:
#   GLITCHTIP_SECRET_KEY  GLITCHTIP_POSTGRES_PASSWORD
#   GLITCHTIP_PUBLIC_URL  (e.g. https://errors.kp.example.com)
#
# After the first start, exec into `glitchtip-web` and run
#   ./manage.py createsuperuser
# then open the public URL to grab the DSN and stick it into SENTRY_DSN.

services:
  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
    volumes:
      - glitchtip-postgres:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_PUBLIC_URL}
      ENABLE_OPEN_USER_REGISTRATION: "false"

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}

volumes:
  glitchtip-postgres:
