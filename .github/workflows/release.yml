name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish-api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest

  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
      - name: Materialise release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Decode keystore + write key.properties so build.gradle.kts picks the
        # release signing config up. Both files live in apps/mobile/android and
        # vanish with the runner.
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/kp-release.keystore
          cat > android/key.properties <<EOF
          storeFile=kp-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Build signed release APK
        env:
          KP_GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ secrets.KP_GOOGLE_OAUTH_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=KP_API_BASE=https://kulturniprehled.example.com \
            --dart-define=KP_GOOGLE_OAUTH_SERVER_CLIENT_ID=$KP_GOOGLE_OAUTH_SERVER_CLIENT_ID
          # Tag the artifact with the release version so users picking it up
          # from /releases can tell at a glance which one they have.
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kp-mobile-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/kp-mobile-${{ github.ref_name }}.apk

  github-release:
    needs:
      - publish-api-image
      - build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
