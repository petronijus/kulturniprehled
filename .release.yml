name: kulturniprehled
tag_format: v{version}
version_files:
  - path: apps/mobile/pubspec.yaml      # version: X.Y.Z+N (build number N also increments)
changelog: CHANGELOG.md
artifacts:
  mode: local                           # built locally; not in GitHub CI
  local_build: just build-aab               # signed with the Play upload key (1Password)
  # The bundle goes to Play internal testing and iOS to TestFlight
  # (docs/release.md); the GitHub release carries the notes only.
  local_upload: []
registry:
  images: []
preflight_extra:
  - just ci                             # the full gate; there is no hosted CI
