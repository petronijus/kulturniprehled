[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kp-api"
version = "1.0.0"
description = "Kulturní Přehled — backend API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Petr Parkan Janda" }]
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.31",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "python-jose[cryptography]>=3.5",
  "authlib>=1.8",
  "httpx>=0.28",
  "anthropic>=1.9",
  "google-api-python-client>=2.200",
  "google-auth>=2.59",
  "google-auth-oauthlib>=1.5",
  "minio>=7.2",
  # Shared-calendar ingest. `icalendar` parses the feed (VTIMEZONE, folded
  # lines, escaping); `recurring-ical-events` expands RRULE/EXDATE and
  # RECURRENCE-ID overrides over a window — both are things a hand-rolled
  # VEVENT scanner gets wrong quietly.
  "icalendar>=7.3",
  "recurring-ical-events>=3.8",
  "slowapi>=0.1.10",
  "structlog>=26.1",
  "uuid-utils>=1.0",
  "sentry-sdk[fastapi]>=2.71",
  # zoneinfo fallback — python:3.12-slim ships no system tz database, and the
  # season planner buckets events into Europe/Prague ISO weeks.
  "tzdata>=2026.4",
]

[dependency-groups]
# Installed by `uv sync` / `uv run` by default; the image's `pip install -e .`
# leaves them out.
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "testcontainers[postgres,minio]>=4.15",
  "httpx>=0.28",
  "ruff>=0.16",
  "mypy>=2.3",
  "types-python-jose",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kp_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle + pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "ASYNC",        # async correctness
  "S",            # bandit (security)
  "RUF",          # ruff-specific
]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*", "authlib.*", "recurring_ical_events.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # asyncpg / asyncio occasionally leaks transient socket cleanup warnings on
  # teardown when the loop exits before the OS-level close completes. They
  # are noise, not bugs.
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
