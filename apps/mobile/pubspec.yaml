name: kp_mobile
description: "Kulturní Přehled — shared cultural-event tracker (Android + iOS)."
publish_to: "none"
version: 1.1.0+21

environment:
  sdk: ^3.11.5
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.20.3
  path_provider: ^2.1.5
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  intl: ^0.20.1
  path: ^1.9.0
  pdfrx: ^2.6.5
  sentry_flutter: ^9.30.1
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  cupertino_icons: ^2.0.0
  sensors_plus: ^7.0.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  crypto: ^3.0.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  xml: ^7.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Gloock
      fonts:
        - asset: assets/fonts/Gloock-Regular.ttf
    - family: StackSansHeadline
      fonts:
        - asset: assets/fonts/StackSansHeadline-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/StackSansHeadline-Light.ttf
          weight: 300
        - asset: assets/fonts/StackSansHeadline-Regular.ttf
          weight: 400
        - asset: assets/fonts/StackSansHeadline-Medium.ttf
          weight: 500
        - asset: assets/fonts/StackSansHeadline-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/StackSansHeadline-Bold.ttf
          weight: 700
