[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kp-api"
version = "0.0.1"
description = "Kulturní Přehled — backend API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Petr Parkan Janda" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "python-jose[cryptography]>=3.3",
  "authlib>=1.3",
  "httpx>=0.27",
  "anthropic>=0.40",
  "google-api-python-client>=2.149",
  "google-auth>=2.36",
  "google-auth-oauthlib>=1.2",
  "minio>=7.2",
  "slowapi>=0.1.9",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers[postgres,minio]>=4.8",
  "httpx>=0.27",
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "types-python-jose",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kp_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle + pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "ASYNC",        # async correctness
  "S",            # bandit (security)
  "RUF",          # ruff-specific
]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
