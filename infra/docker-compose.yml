# Development stack. Run from the repository root:
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Reads variables from a top-level .env (copy from .env.example).

name: kulturniprehled-dev

# MinIO server and `mc` client, one image for minio-perms, minio and
# minio-init. Upstream deleted minio/minio and minio/mc from Docker Hub
# (2026-09-11), so this is Chainguard's build (cgr.dev/chainguard/minio)
# mirrored byte-for-byte into our own GHCR package — it cannot vanish under
# us again. Private package: the host needs `docker login ghcr.io`. Refresh:
# docs/development.md#minio-image. Runs as nonroot 65532, ships `mc`, bash
# as `sh` and GNU coreutils, but no curl, wget or find.
x-minio-image: &minio-image ghcr.io/petronijus/minio:RELEASE.2026-09-22T19-25-18Z@sha256:25bc63a89475bc494bfbce9bbeddb0421aece3f3968d77c809db5104d07b4545

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      # Global watchtower on VM 105 auto-updates everything without this
      # label. Postgres/MinIO upgrade manually after reading release notes
      # (see upgrade.sh) and the API deploys only via upgrade.sh — none of
      # them may have a second, unattended deploy channel.
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kp}
      POSTGRES_USER: ${POSTGRES_USER:-kp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kp} -d ${POSTGRES_DB:-kp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot ownership fix, run before every minio start. Volumes created
  # before 2026-10 hold data written by the official minio/minio image,
  # which ran as root; this image runs minio as nonroot 65532 and refuses to
  # start on root-owned data ("Unable to initialize backend: Unable to write
  # to the backend"). Gives everything under /data to 65532:65532 and logs
  # how many entries actually changed (`chown -c`), 0 once migrated. The image
  # has GNU coreutils but no findutils, hence chown -R rather than find.
  minio-perms:
    image: *minio-image
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -o pipefail;
        changed=$$(chown -R -c 65532:65532 /data | wc -l);
        echo "minio-perms: $$changed entries handed to 65532:65532"
    volumes:
      - minio-data:/data

  minio:
    image: *minio-image
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kp-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    ports:
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the tickets bucket on `up`. The backup scripts in infra/backup
  # reuse this service as their `mc` shell (`run --entrypoint /bin/sh
  # minio-init -c ...`), which is why the credentials sit in its environment
  # and the scripts expand them inside the container.
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-kp-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_TICKETS: ${MINIO_BUCKET_TICKETS:-tickets}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set kp http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
        mc mb --ignore-existing "kp/$$MINIO_BUCKET_TICKETS" &&
        mc anonymous set none "kp/$$MINIO_BUCKET_TICKETS"

  api:
    image: ghcr.io/petronijus/kulturniprehled-api:${KP_API_TAG:-latest}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kp}
      POSTGRES_USER: ${POSTGRES_USER:-kp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-kp-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET_TICKETS: ${MINIO_BUCKET_TICKETS:-tickets}
      # Public endpoint baked into presigned URLs — must match the host
      # mobile clients actually hit (Cloudflare-tunneled subdomain in prod).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-}
      MINIO_PRESIGNED_URL_TTL_SECONDS: ${MINIO_PRESIGNED_URL_TTL_SECONDS:-900}
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET in .env}
      API_JWT_ACCESS_TTL_SECONDS: ${API_JWT_ACCESS_TTL_SECONDS:-900}
      API_JWT_REFRESH_TTL_SECONDS: ${API_JWT_REFRESH_TTL_SECONDS:-2592000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      # Shared household calendar (secret iCal address) → blocked days.
      CALENDAR_ICS_URL: ${CALENDAR_ICS_URL:-}
      CALENDAR_CACHE_TTL_SECONDS: ${CALENDAR_CACHE_TTL_SECONDS:-900}
      # Public-holiday feed; empty string disables the grid marks.
      HOLIDAYS_ICS_URL: ${HOLIDAYS_ICS_URL:-https://calendar.google.com/calendar/ical/en.czech%23holiday%40group.v.calendar.google.com/public/basic.ics}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # Venues refused at pool ingest and purged on the next scrape.
      SEASON_VENUE_VETO: ${SEASON_VENUE_VETO:-}
      # Spotify — only for the planner's in-page player (Web Playback SDK).
      # The refresh token never leaves the server; the SPA gets one-hour
      # access tokens from GET /v1/season/spotify-token.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # Discogs taste map served via /v1/digest/context (empty → discogs: null).
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      DISCOGS_USERNAME: ${DISCOGS_USERNAME:-}
      # SMTP relay for POST /v1/digest/send (empty SMTP_HOST → endpoint 503s).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      DIGEST_MAIL_FROM: ${DIGEST_MAIL_FROM:-}
      DIGEST_MAIL_TO: ${DIGEST_MAIL_TO:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Season planner (home-only SPA at /app): WEB_PUBLIC=false blocks it
      # on the Cloudflare path; WEB_TRUSTED_LAN=true lets direct LAN /
      # Tailscale requests use it without login (season scopes only).
      WEB_PUBLIC: ${WEB_PUBLIC:-false}
      WEB_TRUSTED_LAN: ${WEB_TRUSTED_LAN:-false}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  minio-data:
