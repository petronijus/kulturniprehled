name: kp_mobile
description: "Kulturní Přehled — shared cultural-event tracker (Android + iOS)."
publish_to: "none"
version: 1.0.7+8

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  intl: ^0.20.1
  path: ^1.9.0
  pdfrx: ^1.1.0
  sentry_flutter: ^9.7.0
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Gloock
      fonts:
        - asset: assets/fonts/Gloock-Regular.ttf
    - family: StackSansHeadline
      fonts:
        - asset: assets/fonts/StackSansHeadline-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/StackSansHeadline-Light.ttf
          weight: 300
        - asset: assets/fonts/StackSansHeadline-Regular.ttf
          weight: 400
        - asset: assets/fonts/StackSansHeadline-Medium.ttf
          weight: 500
        - asset: assets/fonts/StackSansHeadline-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/StackSansHeadline-Bold.ttf
          weight: 700
